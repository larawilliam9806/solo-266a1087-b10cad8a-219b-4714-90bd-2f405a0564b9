<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}旧成绩补交学分核对{% endblock %}</title>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;max-width:1000px;margin:0 auto;padding:1rem 1.2rem;color:#222}
  nav{margin-bottom:1rem} nav a{margin-right:1.2rem;color:#0b5cad;text-decoration:none} nav a:hover{text-decoration:underline}
  table{border-collapse:collapse;width:100%;margin:.6rem 0}
  th,td{border:1px solid #ccc;padding:.4rem .6rem;text-align:left;font-size:.94rem;vertical-align:top}
  th{background:#f2f2f2}
  .ok{color:#0a7a0a}.bad{color:#b00020}.muted{color:#777}
  .flash{padding:.55rem .9rem;margin:.6rem 0;border-radius:5px}
  .flash.ok{background:#e6f4ea;border:1px solid #b7dfc0}.flash.err{background:#fde7e9;border:1px solid #f3c2c7}
  input,textarea,button{font-size:1rem}
  textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,Consolas,monospace}
  .card{border:1px solid #ddd;border-radius:8px;padding:1rem 1.2rem;margin:1rem 0}
  .total{font-size:1.6rem;font-weight:700}
  button{cursor:pointer}
  .btn-danger{background:#b00020;color:#fff;border:0;border-radius:4px;padding:.25rem .7rem}
  code{background:#f5f5f5;padding:0 .3em;border-radius:3px}
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('main.index') }}">学分查询</a>
  <a href="{{ url_for('main.upload') }}">上传成绩单</a>
  <a href="{{ url_for('main.admin_base') }}">底表管理</a>
</nav>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
